; /etc/asterisk/extensions_custom.conf - add to what is there.
;
; A test extension: dial 6368 (MENU on the keypad) from a
; modem on one of your FreePBX extensions (an ATA, or D-Modem itself with
; ATDT6368) and you reach modemmenu.  The D-Modem module's Apply Config
; writes the app-dmodem context, with one extension for each profile.
[from-internal-custom]
exten => 6368,1,Goto(app-dmodem,menu,1)
