;
; /etc/modemmenu/modemmenu.conf - modemmenu for FreePBX
;
; Callers log in with a name and password from a text file
; (/etc/modemmenu/modemmenu.users), then get a small menu.  One modemmenu
; -serve (modemmenu.service) answers every call on a unix socket, and
; FreePBX's D-Modem module sends its "menu" profile there:
;
;   Applications > D-Modem > Profiles > Add
;     Name:               menu
;     Data goes to:       A server on a unix socket
;     Socket:             /run/modemmenu/modemmenu.sock
;     Call details first: on
;
; then pick the destination "D-Modem: menu" on an inbound route.  See
; README.md beside this file for the whole setup.  Check this file with
;
;   modemmenu -check -config /etc/modemmenu/modemmenu.conf
;
; Every option is in samples/modemmenu.conf.sample in the repository.

[general]
; the journal (journalctl -t modemmenu), never the caller's line
log = syslog
; logins from the users file only
auth = file
banner = "\r\nWelcome to D-Modem on FreePBX.\r\n"
login_prompt = "\r\nlogin: "
password_prompt = "Password: "
connect_message = "\r\nConnected at {speed}.\r\n"
welcome = "\r\nHello {user}, on {date} at {time}.\r\n"
;motd = "\r\nThe line is down for maintenance on Sunday.\r\n"
;motd_file = /etc/modemmenu/motd
goodbye = "\r\nGoodbye.\r\n"
password_echo = *
; three tries, 3 s after each wrong one, 90 s to log in
attempts = 3
fail_delay = 3
login_timeout = 90
idle_timeout = 300
user_pattern = ^[A-Za-z0-9][A-Za-z0-9._@-]{0,63}$
; an hour a call, two hours a day for each user (kept in state_dir)
time_limit = 60m
daily_limit = 2h
state_dir = /var/lib/modemmenu
time_warning = 5m 1m

; who may use the sysop items (a name from the users file)
[groups]
;sysops = alice

; the users file: user:hash lines.  modemmenu -hash prints a bcrypt hash
[file]
path = /etc/modemmenu/modemmenu.users
hash = auto

; callers who type "new" at the login prompt choose a name and password,
; added to the users file locked (user:!hash) until you remove the !
[signup]
enabled = no
name = new
pending = yes
min_password = 8

[guest]
enabled = no

; caller ID: all callers, withheld numbers too
[callerid]
anonymous = yes

; the server FreePBX's "menu" profile connects to.  socket_group = asterisk
; lets Asterisk (and dmodem-ari, running as asterisk) connect, and nobody
; else; header = yes reads the call's details that "Call details first"
; sends (rate, caller ID, channel)
[server]
listen = /run/modemmenu/modemmenu.sock
socket_mode = 0660
socket_group = asterisk
header = yes
header_timeout = 10
trust_user = no
max_sessions = 8

; Windows' Dial-Up Networking starts PPP at once and logs in with PAP.
; enabled = yes takes those callers to pppd, with the login checked against
; the users file by pppd's modemmenu.so plugin (make builds it when ppp-dev
; is installed)
[autoppp]
enabled = no
command = exec /usr/sbin/pppd nodetach lock passive local 192.168.77.1:192.168.77.2 ms-dns 192.168.77.1 require-pap refuse-chap refuse-mschap refuse-mschap-v2 refuse-eap plugin modemmenu.so ipparam autoppp
item = ppp

[menu]
title = "\r\nMain menu\r\n"
prompt = "\r\nSelection ({time_left} min left): "
; add bbs here once D-Modem's BBS is set up (below)
items = ppp callers passwd
hangup = G goodbye bye logoff
hotkeys = no

; PPP: dial-up networking (apt install ppp).  The caller has logged in
; already, so noauth.  The addresses are one pair: one PPP caller at a time,
; or give each line its own pair
[item ppp]
key = P
aliases = dialup net
label = PPP (dial-up networking)
min_baud = 9600
time_warning = no
mode = exec
command = exec /usr/sbin/pppd nodetach noauth local lock passive 192.168.77.1:192.168.77.2 ms-dns 192.168.77.1 ipparam {user}

; who called last
[item callers]
key = L
label = Last callers
mode = callers
count = 10
after = menu

; callers change their own password in the users file
[item passwd]
key = PW
label = Change your password
mode = passwd
min_password = 8

; D-Modem's BBS (https://github.com/D-Modem/bbs) takes the caller as logged
; in here: its bbs.conf [listen menu] with type = raw, address =
; /run/bbs/menu.sock, header = yes, trust_user = yes, create_users = yes
; (modemmenu.service runs as root, so it can reach the socket whatever its
; group).  Then add bbs to items above
[item bbs]
key = B
label = Bulletin board
mode = unix
path = /run/bbs/menu.sock
header = yes
pass_password = no
after = menu
