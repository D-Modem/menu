# /etc/modemmenu/dnsmasq.conf: the dial-up callers' DNS server, run by
# modemmenu-dns.service in their VRF.  [ppp_pool] dns (ms-dns) points
# callers here.  A DNS server only: no DHCP (PPP's IPCP gives the
# addresses).

# on the callers' side only (dialup.conf's SERVER_ADDR), never the host's
# own networks
listen-address=10.77.0.1
bind-interfaces
pid-file=/run/modemmenu-dns.pid

# upstream: these, not the host's resolv.conf (its 127.0.0.53 is not in
# the VRF)
no-resolv
server=9.9.9.9
server=1.1.1.1
domain-needed
bogus-priv
cache-size=1000

# names of this system: bbs.dialup and the like, answered here only
local=/dialup/
address=/bbs.dialup/10.77.0.1

# the overrides for the services we provide: every *.conf here
# (services.conf, and a file per front end)
conf-dir=/etc/modemmenu/dns.d/,*.conf
