# /etc/modemmenu/dns.d/services.conf: the old services' names, answered
# with this system's address so that the callers' unchanged clients reach
# our front ends.  address=/name/ip also answers every name under it.
# Uncomment a service once its front end runs; a front end may instead
# drop a file of its own here (dns.d/NAME.conf).  After a change:
# systemctl reload modemmenu-dns

# AIM and ICQ (OSCAR, TCP 5190)
#address=/login.oscar.aol.com/100.77.0.1
#address=/login.icq.com/100.77.0.1

# AOL's client (TCP 5190)
#address=/americaonline.aol.com/100.77.0.1

# MSN Messenger (TCP 1863), WebTV's Messenger too
#address=/messenger.hotmail.com/100.77.0.1

